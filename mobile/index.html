<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>AuraAudio Mobile</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#09090b;color:#f4f4f5;--accent:#3b82f6}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100dvh;background:radial-gradient(ellipse at top,#161b2a,#09090b 50%)}button,input{font:inherit}button{color:inherit;border:0;cursor:pointer}.app{max-width:680px;margin:auto;padding:18px 16px 122px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.04em}.badge{color:#a1a1aa;font-size:12px}.search{display:flex;gap:8px;margin:20px 0 12px}.search input{min-width:0;flex:1;background:#18181b;border:1px solid #303036;border-radius:12px;padding:13px;color:#fff;outline:none}.search button,.primary{background:var(--accent);border-radius:12px;padding:0 15px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.tabs button{background:#18181b;border:1px solid #303036;border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:13px}.tabs button.active{background:#27272a;border-color:#52525b}.message{color:#a1a1aa;font-size:13px;padding:8px 2px}.section{margin-top:18px}.section h2{font-size:14px;color:#a1a1aa;text-transform:uppercase;letter-spacing:.1em}.list{display:grid;gap:8px}.row{display:flex;align-items:center;gap:10px;min-width:0;padding:12px;background:#151518;border:1px solid #27272a;border-radius:13px}.info{flex:1;min-width:0}.name{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:#a1a1aa;font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon{background:#27272a;border-radius:9px;padding:9px;font-size:12px}.heart{color:#71717a;background:transparent;font-size:20px;padding:5px}.heart.liked{color:#fb5363}.mix{background:linear-gradient(130deg,#172554,#18181b 75%);padding:15px;border-radius:16px;border:1px solid #334155}.mix button{margin-top:12px;width:100%;padding:12px;background:var(--accent);border-radius:12px;font-weight:700}.player{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#111114f2;border-top:1px solid #303036;backdrop-filter:blur(18px)}.player-inner{max-width:680px;margin:auto}.player-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}.player-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.controls{display:flex;align-items:center;gap:16px}.controls button{background:transparent;font-size:20px}.controls .play{background:var(--accent);border-radius:50%;width:42px;height:42px}.seek{width:100%;accent-color:var(--accent);margin:8px 0 0}.times{display:flex;justify-content:space-between;color:#a1a1aa;font:11px ui-monospace,monospace}.hidden{display:none!important}@media(min-width:600px){.app{padding-top:28px}.search input{padding:15px}.row{padding:14px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">◉ AuraAudio</div><span id="connection" class="badge">Connecting…</span></header>
    <form id="searchForm" class="search"><input id="query" type="search" placeholder="Search tracks, artists, YouTube…" autocomplete="off"><button>Search</button></form>
    <nav class="tabs"><button data-view="search" class="active">Search</button><button data-view="discover">Discover</button><button data-view="liked">Liked</button><button data-view="downloads">Downloads</button></nav>
    <div id="message" class="message">Search your library and music catalog.</div>
    <section id="content"></section>
  </main>
  <footer class="player"><div class="player-inner"><div class="player-meta"><div class="player-title"><div id="trackTitle" class="name">Nothing playing</div><div id="trackArtist" class="sub">Choose a track to start</div></div><div class="controls"><button id="prev" aria-label="Previous">‹</button><button id="toggle" class="play" aria-label="Play">▶</button><button id="next" aria-label="Next">›</button></div></div><input id="seek" class="seek" type="range" min="0" max="100" value="0"><div class="times"><span id="elapsed">00:00</span><span id="duration">00:00</span></div><audio id="audio"></audio></div></footer>
  <script>
    const api=location.origin;const $=s=>document.querySelector(s);const content=$('#content'),message=$('#message'),audio=$('#audio');let queue=[],index=-1,liked=[],likedArtists=[];
    async function get(path){const r=await fetch(api+path,{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.message||data.error||r.statusText);return data}
    async function post(path,body){const r=await fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.message||data.error||r.statusText);return data}
    function say(text,error=false){message.textContent=text;message.style.color=error?'#fca5a5':''}
    function fmt(sec){if(!Number.isFinite(sec))return'00:00';return`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}`}
    function itemRow(item,group='track'){const row=document.createElement('div');row.className='row';const info=document.createElement('div');info.className='info';const title=document.createElement('div');title.className='name';title.textContent=item.title||item.name||'Untitled';const sub=document.createElement('div');sub.className='sub';sub.textContent=[item.artist||item.channel||item.genre,item.duration].filter(Boolean).join(' · ');info.append(title,sub);row.append(info);if(group!=='artist'){const play=document.createElement('button');play.className='icon';play.textContent='▶';play.title='Play';play.onclick=()=>playItem(item);row.append(play)}const heart=document.createElement('button');const isLiked=group==='artist'?likedArtists.some(x=>String(x.id||x.key||x.name).toLowerCase()===String(item.id||item.name).toLowerCase()):liked.some(x=>`${x.title}|${x.artist}`===`${item.title||item.name}|${item.artist||''}`);heart.className='heart'+(isLiked?' liked':'');heart.textContent='♥';heart.onclick=async()=>{try{if(group==='artist')await post('/api/library/artists/toggle',{artist:{id:item.id,name:item.name||item.title,image:item.image||''}});else await post('/api/library/liked/toggle',{track:{...item,id:item.trackId||item.id,title:item.title||item.name,source:group}});await loadLiked()}catch(e){say(e.message,true)}};row.append(heart);return row}
    function group(title,items,type,collapsible=false){if(!items?.length)return;const section=document.createElement(collapsible?'details':'div');section.className='section';if(collapsible)section.open=true;const h=document.createElement(collapsible?'summary':'h2');h.textContent=`${title} · ${items.length}`;if(collapsible)h.style.cssText='cursor:pointer;list-style:none';section.append(h);const list=document.createElement('div');list.className='list';items.forEach(x=>list.append(itemRow(x,type)));section.append(list);content.append(section)}
    async function playItem(item,queueIndex=null){say(`Preparing ${item.title||item.name}…`);try{let track=item;if(!item.streamUrl){const started=await post('/api/ytb/download',{url:item.url||`${item.title||item.name} ${item.artist||''}`,title:item.title||item.name});let state;do{await new Promise(r=>setTimeout(r,900));state=await get(`/api/ytb/progress/${encodeURIComponent(started.id)}`);say(`${state.stage||'Downloading'} · ${Math.round(state.progress||0)}% · ${state.downloadsDir||''}`)}while(state.status==='downloading');if(state.status!=='completed')throw Error(state.error||'Download failed');track={...item,streamUrl:state.result?.streamUrl||`/api/media/${encodeURIComponent(state.result.fileName)}`}}const queued={title:track.title||track.name,artist:track.artist||track.channel||'',url:track.streamUrl};if(queueIndex===null){queue.push(queued);playIndex(queue.length-1)}else{queue[queueIndex]=queued;playIndex(queueIndex)}}catch(e){say(e.message,true)}}
    function playIndex(i){if(i<0||i>=queue.length)return;index=i;const t=queue[index];if(!t.url){playItem({...t.source,title:t.title,artist:t.artist},i);return}audio.src=t.url;$('#trackTitle').textContent=t.title;$('#trackArtist').textContent=t.artist;audio.play().catch(e=>say(`Playback error: ${e.message}`,true));say('Now playing')}
    async function search(){const q=$('#query').value.trim();if(!q)return;content.innerHTML='';say('Searching…');try{const data=await get(`/api/search?q=${encodeURIComponent(q)}`);group('Tracks',data.tracks,'catalog');group('YouTube',data.youtube,'youtube');group('Artists',data.artists.map(x=>({...x,title:x.name,artist:x.genre})),'artist');group('Your library',data.library,'library');say(content.children.length?'Tap ▶ to download and play a result.':'No results found.')}catch(e){say(e.message,true)}}
    async function loadLiked(){[liked,likedArtists]=await Promise.all([get('/api/library/liked'),get('/api/library/artists/liked')]);content.innerHTML='';group('Liked artists',likedArtists.map(x=>({...x,title:x.name,artist:'Artist'})),'artist',true);group('Liked songs',liked,'liked',true);say(liked.length||likedArtists.length?'Your liked music':'Like songs or artists to see them here.')}
    async function discover(){content.innerHTML='';say('Building a mix from your listening history…');try{const mixes=await get('/api/discovery/daily-mix');if(!mixes.length){say('Play or like a few tracks to build your personalized mix.');return}mixes.forEach(m=>{const card=document.createElement('article');card.className='mix';const h=document.createElement('div');h.className='name';h.textContent=m.title;const d=document.createElement('div');d.className='sub';d.textContent=m.description;card.append(h,d);(m.tracks||[]).slice(0,6).forEach(t=>card.append(itemRow(t,'mix')));const all=document.createElement('button');all.textContent=`Play all ${m.tracks.length} tracks`;all.onclick=()=>{queue=m.tracks.map(t=>({title:t.title,artist:t.artist,url:null,source:t}));playIndex(0)};card.append(all);content.append(card)});say('Personalized from recent plays and liked music.')}catch(e){say(e.message,true)}}
    async function downloads(){content.innerHTML='';say('Loading downloads…');try{const rows=await get('/api/library/downloads');group('Downloads',rows.map(x=>({...x,streamUrl:`/api/media/${encodeURIComponent(x.fileName)}`})),'download');say(rows.length?'Tap ▶ to play a download.':'No downloads yet.')}catch(e){say(e.message,true)}}
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));({search,discover,liked:loadLiked,downloads}[b.dataset.view]||search)()});$('#searchForm').onsubmit=e=>{e.preventDefault();search()};$('#toggle').onclick=()=>audio.paused?audio.play():audio.pause();$('#next').onclick=()=>playIndex((index+1)%queue.length);$('#prev').onclick=()=>playIndex((index-1+queue.length)%queue.length);audio.ontimeupdate=()=>{$('#seek').value=audio.duration?audio.currentTime/audio.duration*100:0;$('#elapsed').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration)};audio.onended=()=>playIndex((index+1)%queue.length);$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
    get('/api/status').then(x=>{$('#connection').textContent=`Server online · ${x.downloadsDir}`}).catch(e=>{$('#connection').textContent='Server unavailable';say(e.message,true)});
  </script>
</body>
</html>
